name: Maestro E2E (Android Emulator)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: maestro-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests — Android Emulator
    runs-on: ubuntu-22.04
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
          save-always: true

      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://ctrlcusto.duckdns.org/api
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://ctrlcusto.duckdns.org/api
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-${{ runner.os }}
          restore-keys: avd-34-${{ runner.os }}
          save-always: true

      - name: Create AVD snapshot (only if no cache)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot criado"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb shell 'until settings get global device_provisioned 2>/dev/null | grep -q 1; do sleep 2; done'
            adb shell 'until pm path android > /dev/null 2>&1; do sleep 2; done'
            adb install -r -g apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.hebert.ctrlcusto || true
            adb shell am start -n com.hebert.ctrlcusto/.MainActivity
            sleep 90
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            maestro test --output maestro-report.xml .maestro/

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            ~/.maestro/tests/**

name: Detox E2E (Android)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: detox-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests — Android
    runs-on: ubuntu-22.04
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
          save-always: true

      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://ctrlcusto.duckdns.org/api
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK + test APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://ctrlcusto.duckdns.org/api
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleAndroidTest -DtestBuildType=debug --no-daemon --no-build-cache

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb shell 'until settings get global device_provisioned 2>/dev/null | grep -q 1; do sleep 2; done'
            adb shell settings put global anr_show_background 0
            cd apps/mobile && pnpm e2e:ci

      - name: Upload Detox results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-results
          path: apps/mobile/artifacts/
